<meta name="apple-mobile-web-app-title" content="IC Einkauf">
<title>Messe-Einkauf</title>
<style>
:root {
  --bg: #ffffff;
  --bg2: #f5f5f5;
  --bg3: #ebebeb;
  --text: #1a1a1a;
  --text2: #6b6b6b;
  --text3: #a0a0a0;
  --border: rgba(0,0,0,0.12);
  --border2: rgba(0,0,0,0.22);
  --green: #1D9E75;
  --green-bg: #E1F5EE;
  --green-text: #085041;
  --blue: #185FA5;
  --blue-bg: #E6F1FB;
  --blue-text: #0C447C;
  --purple-bg: #EEEDFE;
  --purple-text: #3C3489;
  --red: #E24B4A;
  --amber-bg: #FAEEDA;
  --amber-text: #854F0B;
  --radius: 10px;
  --radius-sm: 8px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e;
    --bg2: #2c2c2e;
    --bg3: #3a3a3c;
    --text: #f2f2f7;
    --text2: #aeaeb2;
    --text3: #636366;
    --border: rgba(255,255,255,0.1);
    --border2: rgba(255,255,255,0.2);
    --green-bg: #0a2e22;
    --green-text: #5DCAA5;
    --blue-bg: #0a1e38;
    --blue-text: #85B7EB;
    --purple-bg: #1e1a3e;
    --purple-text: #AFA9EC;
    --amber-bg: #2e2010;
    --amber-text: #EF9F27;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg2); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; color: var(--text); }

/* App shell */
#app { display: flex; flex-direction: column; height: 100%; max-width: 430px; margin: 0 auto; background: var(--bg); position: relative; }

/* Header */
.header { background: var(--bg); border-bottom: 0.5px solid var(--border); padding: calc(var(--safe-top) + 12px) 18px 0; flex-shrink: 0; }
.header-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; min-height: 36px; }
.back-btn { background: none; border: none; cursor: pointer; color: var(--green); font-size: 16px; display: flex; align-items: center; gap: 4px; padding: 0; font-family: inherit; flex-shrink: 0; }
.header-title { font-size: 17px; font-weight: 600; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-action { background: none; border: none; cursor: pointer; color: var(--green); font-size: 26px; line-height: 1; padding: 0; flex-shrink: 0; }
.nav-tabs { display: flex; }
.nav-tab { flex: 1; padding: 9px 0; font-size: 13px; border: none; background: transparent; cursor: pointer; color: var(--text2); font-family: inherit; border-bottom: 2px solid transparent; transition: all .15s; }
.nav-tab.active { color: var(--green); border-bottom-color: var(--green); font-weight: 600; }

/* Scrollable content */
.content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px calc(var(--safe-bottom) + 80px); }

/* Cards */
.card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 13px 15px; margin-bottom: 10px; cursor: pointer; }
.card:active { opacity: 0.7; }
.card-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-name { font-size: 15px; font-weight: 600; color: var(--text); }
.card-meta { font-size: 13px; color: var(--text2); margin-top: 3px; }
.chevron { font-size: 18px; color: var(--text3); flex-shrink: 0; }

/* Section box */
.sec { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
.sec-title { font-size: 11px; font-weight: 600; color: var(--text2); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 12px; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 0.5px solid var(--border); }
.row:last-child { border-bottom: none; }
.rl { font-size: 13px; color: var(--text2); }
.rv { font-size: 13px; font-weight: 500; color: var(--text); text-align: right; }

/* Form fields */
.fg { margin-bottom: 16px; }
.fl { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
.req { color: var(--red); font-size: 11px; }
.fg input, .fg textarea, .fg select {
  width: 100%; font-size: 16px; font-family: inherit; color: var(--text);
  background: var(--bg2); border: 0.5px solid var(--border2);
  border-radius: var(--radius-sm); padding: 10px 12px; outline: none;
  -webkit-appearance: none; appearance: none;
}
.fg input:focus, .fg textarea:focus { border-color: var(--green); }
.fg textarea { resize: none; }
.inline3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.err-msg { font-size: 12px; color: var(--red); margin-top: 4px; display: none; }

/* Buttons */
.btn-p { width: 100%; padding: 14px; background: var(--green); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; }
.btn-p:active { opacity: 0.85; }
.btn-s { width: 100%; padding: 13px; background: transparent; color: var(--text); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); font-size: 15px; font-family: inherit; cursor: pointer; margin-top: 10px; }
.btn-s:active { opacity: 0.7; }

/* Photo zone */
.photo-zone { background: var(--bg2); border: 1px dashed var(--border2); border-radius: var(--radius-sm); padding: 18px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; margin-bottom: 14px; }
.prow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.pthumb { width: 70px; height: 70px; background: var(--bg2); border-radius: var(--radius-sm); border: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; font-size: 28px; }
.pthumb.filled { background: var(--green-bg); border-color: var(--green); }
.pdel { position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; background: var(--red); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; color: #fff; font-style: normal; }

/* Toggles */
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 0.5px solid var(--border); }
.toggle-row:last-child { border-bottom: none; }
.toggle-row .tl { font-size: 13px; color: var(--text2); flex: 1; }
.tog { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
.tog input { opacity: 0; width: 0; height: 0; }
.tog-sl { position: absolute; inset: 0; background: var(--bg3); border-radius: 13px; cursor: pointer; transition: .2s; }
.tog-sl:before { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
.tog input:checked + .tog-sl { background: var(--green); }
.tog input:checked + .tog-sl:before { transform: translateX(18px); }

/* Pills */
.pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
.pill-g { background: var(--green-bg); color: var(--green-text); }
.pill-b { background: var(--blue-bg); color: var(--blue-text); }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; margin-bottom: 12px; }
.badge-purple { background: var(--purple-bg); color: var(--purple-text); }
.badge-blue { background: var(--blue-bg); color: var(--blue-text); }

/* Avatars */
.av { width: 46px; height: 46px; border-radius: 10px; background: var(--green-bg); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--green-text); flex-shrink: 0; }

/* Result cards */
.rcard { background: var(--bg2); border-radius: var(--radius-sm); padding: 11px 13px; margin-bottom: 8px; }
.rcard:last-child { margin-bottom: 0; }
.rcard.green { background: var(--green-bg); }
.rcard.blue { background: var(--blue-bg); }
.rc-lbl { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
.rc-lbl.g { color: var(--green-text); }
.rc-lbl.b { color: var(--blue-text); }
.rc-val { font-size: 17px; font-weight: 700; color: var(--text); }
.rc-val.g { color: var(--green-text); }
.rc-val.b { color: var(--blue-text); }
.rc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Vol info bar */
.vol-bar { background: var(--green-bg); border-radius: var(--radius-sm); padding: 9px 13px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }

/* FAB */
.fab { position: absolute; bottom: calc(var(--safe-bottom) + 20px); right: 20px; width: 52px; height: 52px; background: var(--green); border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; z-index: 10; }
.fab:active { opacity: 0.85; }

/* Settings toggle */
.settings-btn { background: none; border: none; cursor: pointer; font-size: 12px; color: var(--text3); font-family: inherit; display: flex; align-items: center; gap: 4px; padding: 0; margin-bottom: 10px; }

/* Empty state */
.empty { color: var(--text3); font-size: 14px; padding: 30px 0; text-align: center; }

/* Calc cost block */
.cblock { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 0.5px solid var(--border); }
.cblock:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.cblock-title { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 7px; }

/* Input small (for settings) */
.inp-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 0.5px solid var(--border); }
.inp-row:last-child { border-bottom: none; }
.inp-row label { font-size: 13px; color: var(--text2); flex: 1; }
.inp-row input { width: 95px; font-size: 14px; font-family: inherit; color: var(--text); background: var(--bg2); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); padding: 5px 8px; outline: none; text-align: right; -webkit-appearance: none; }
.inp-row input:focus { border-color: var(--green); }

.hidden { display: none !important; }

/* Swipe-to-delete */
.swipe-wrap { position: relative; overflow: hidden; border-radius: var(--radius); margin-bottom: 10px; }
.swipe-wrap .card { margin-bottom: 0; border-radius: var(--radius); transition: transform .25s ease; }
.del-btn { position: absolute; right: 0; top: 0; bottom: 0; width: 80px; background: var(--red); display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 0 var(--radius) var(--radius) 0; }
.del-btn span { color: #fff; font-size: 12px; font-weight: 600; text-align: center; line-height: 1.3; }
</style>
</head>
<body>
<div id="app">
  <div class="header" id="header">
    <div class="header-row" id="header-row-main" style="gap:8px">
      <button class="back-btn hidden" id="back-btn" onclick="goBack()">&#8249; <span id="back-lbl">Zurück</span></button>
      <div class="header-title" id="header-title">Messen</div>
      <button class="header-action" id="top-plus" onclick="topPlusAction()">+</button>
    </div>
    <div class="nav-tabs hidden" id="nav-tabs">
      <button class="nav-tab active" id="tab-sup" onclick="mainTab('suppliers',this)">Lieferanten</button>
      <button class="nav-tab" id="tab-art" onclick="mainTab('all-articles',this)">Alle Artikel</button>
    </div>
  </div>

  <div class="content" id="content"></div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
const S = {
  events: [],
  currentEvent: null,
  currentSupplier: null,
  currentArtikel: null,
  vcP: 0, artP: 0,
  stack: [],
  tab: 'suppliers',
  settings: { fx: 1.08, markup: 45, sf20: 1800, sf40: 2800, sf40h: 3000 }
};

// ─── Constants ────────────────────────────────────────────────────────────────
const CTN = { ft20: 25, ft40: 55, ft40h: 67.5 };
const FIX = {
  ebs: { ft20: 125, ft40: 250, ft40h: 250 },
  thc_isps: 285, release: 79.75, zollabf: 45, fracht: 525,
  finanz: 0.0225, bank_usd: 40, rma: 0.03,
  psi_usd: 300, ffu_eur: 2500
};

// ─── Helpers ──────────────────────────────────────────────────────────────────
function calcVol(l,b,h){ return (l*b*h)/1000000; }
function ktnCount(vol,cbm){ return Math.floor(cbm/vol); }
function fmt(n,d=2){ return n.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtE(n){ return '€\u202f'+fmt(n); }
function fmtU(n){ return 'USD\u202f'+fmt(n); }
function initials(name){ return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function uid(){ return '_'+Math.random().toString(36).slice(2,9); }

// ─── Persist ──────────────────────────────────────────────────────────────────
function save(){
  try { localStorage.setItem('messe_app_v1', JSON.stringify({events:S.events,settings:S.settings})); } catch(e){}
}
function load(){
  try {
    const d = localStorage.getItem('messe_app_v1');
    if(d){ const p=JSON.parse(d); S.events=p.events||[]; if(p.settings) S.settings=Object.assign(S.settings,p.settings); }
  } catch(e){}
}

// ─── Navigation ───────────────────────────────────────────────────────────────
function showScreen(id, push=true){
  if(push) S.stack.push(id);
  const isEvents  = id==='events';
  const isEventSub= id==='suppliers'||id==='all-articles';
  const isCalc    = id==='kalkulation';

  document.getElementById('back-btn').classList.toggle('hidden', isEvents);
  document.getElementById('nav-tabs').classList.toggle('hidden', !isEventSub);
  document.getElementById('top-plus').classList.toggle('hidden', isCalc);

  const titles = {
    'events':'Messen','new-event':'Neue Messe',
    'suppliers': S.currentEvent ? S.currentEvent.name : '',
    'all-articles': S.currentEvent ? S.currentEvent.name : '',
    'new-supplier':'Neuer Lieferant','supplier-detail': S.currentSupplier ? S.currentSupplier.name : 'Lieferant',
    'new-artikel':'Neuer Artikel','artikel-detail': S.currentArtikel ? S.currentArtikel.bez : 'Artikel',
    'kalkulation': S.currentArtikel ? S.currentArtikel.bez : 'Kalkulation'
  };
  document.getElementById('header-title').textContent = titles[id]||'';

  const renders = {
    'events': renderEvents,
    'new-event': renderNewEvent,
    'suppliers': renderSuppliers,
    'all-articles': renderAllArticles,
    'new-supplier': renderNewSupplier,
    'supplier-detail': renderSupplierDetail,
    'new-artikel': renderNewArtikel,
    'artikel-detail': renderArtikelDetail,
    'kalkulation': renderKalkulation
  };
  if(renders[id]) renders[id]();
}

function goBack(){
  S.stack.pop();
  const prev = S.stack[S.stack.length-1];
  if(!prev){ S.stack=[]; showScreen('events',false); return; }
  showScreen(prev, false);
}

function mainTab(id, btn){
  S.tab = id;
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  // replace last stack entry
  S.stack[S.stack.length-1] = id;
  showScreen(id, false);
}

function topPlusAction(){
  const cur = S.stack[S.stack.length-1];
  if(!cur||cur==='events') showScreen('new-event');
  else if(cur==='suppliers') showScreen('new-supplier');
  else if(cur==='supplier-detail') showScreen('new-artikel');
}

// ─── Delete helpers ───────────────────────────────────────────────────────────
function confirmDelete(msg, onConfirm){
  if(window.confirm(msg)) onConfirm();
}

function deleteEvent(id, e){
  e.stopPropagation();
  confirmDelete('Messe und alle Lieferanten & Artikel löschen?', ()=>{
    S.events = S.events.filter(x=>x.id!==id);
    if(S.currentEvent && S.currentEvent.id===id) S.currentEvent=null;
    save(); renderEvents();
  });
}

function deleteSupplier(id, e){
  e.stopPropagation();
  confirmDelete('Lieferant und alle Artikel löschen?', ()=>{
    S.currentEvent.suppliers = S.currentEvent.suppliers.filter(x=>x.id!==id);
    if(S.currentSupplier && S.currentSupplier.id===id) S.currentSupplier=null;
    save(); renderSuppliers();
  });
}

function deleteArtikel(id, e){
  e.stopPropagation();
  confirmDelete('Artikel löschen?', ()=>{
    S.currentSupplier.artikel = S.currentSupplier.artikel.filter(x=>x.id!==id);
    if(S.currentArtikel && S.currentArtikel.id===id) S.currentArtikel=null;
    save(); renderSupplierDetail();
  });
}

// Swipe-to-reveal delete
function initSwipe(wrap){
  const card = wrap.querySelector('.card');
  let startX=0, dx=0, swiped=false;
  wrap.addEventListener('touchstart', ev=>{ startX=ev.touches[0].clientX; dx=0; swiped=false; },{passive:true});
  wrap.addEventListener('touchmove', ev=>{
    dx = ev.touches[0].clientX - startX;
    if(dx < -10){ card.style.transform=`translateX(${Math.max(dx,-80)}px)`; swiped=true; }
    else if(dx > 5 && swiped){ card.style.transform='translateX(0)'; swiped=false; }
  },{passive:true});
  wrap.addEventListener('touchend', ()=>{
    if(dx < -40){ card.style.transform='translateX(-80px)'; }
    else { card.style.transform='translateX(0)'; swiped=false; }
  });
}

function makeSwipeCard(innerHtml, deleteFn){
  return `<div class="swipe-wrap" data-swipe>
    <div class="card" style="margin-bottom:0">${innerHtml}</div>
    <div class="del-btn" onclick="${deleteFn}"><span>🗑<br>Löschen</span></div>
  </div>`;
}

function attachSwipes(){
  document.querySelectorAll('[data-swipe]').forEach(initSwipe);
}

// ─── Events ───────────────────────────────────────────────────────────────────
function renderEvents(){
  let html = '';
  if(!S.events.length){
    html = '<div class="empty">Noch keine Messen angelegt.<br>Tippe + um zu starten.</div>';
  } else {
    S.events.forEach(e=>{
      const supC=e.suppliers.length;
      const artC=e.suppliers.reduce((s,x)=>s+x.artikel.length,0);
      const inner = `<div class="card-row" onclick="openEvent('${e.id}')">
          <div style="flex:1">
            <div class="card-name">🏛 ${e.name}</div>
            <div class="card-meta">${supC} Lieferant${supC!==1?'en':''} · ${artC} Artikel</div>
          </div>
          <span class="chevron">›</span>
        </div>`;
      html += makeSwipeCard(inner, `deleteEvent('${e.id}',event)`);
    });
  }
  document.getElementById('content').innerHTML = html;
  attachSwipes();
}

function openEvent(id){
  S.currentEvent = S.events.find(e=>e.id===id);
  S.stack = [];
  document.getElementById('tab-sup').classList.add('active');
  document.getElementById('tab-art').classList.remove('active');
  S.tab = 'suppliers';
  showScreen('suppliers');
}

function renderNewEvent(){
  document.getElementById('content').innerHTML = `
    <div class="sec">
      <div class="sec-title">Neue Messe anlegen</div>
      <div class="fg">
        <div class="fl">Name der Messe <span class="req">*</span></div>
        <input type="text" id="ev-name" placeholder="z.B. Ambiente Frankfurt 2026" autocomplete="off">
        <div class="err-msg" id="ev-err">Bitte Messenamen eingeben</div>
      </div>
    </div>
    <button class="btn-p" onclick="saveEvent()">Anlegen →</button>
    <button class="btn-s" onclick="goBack()">Abbrechen</button>`;
  setTimeout(()=>document.getElementById('ev-name').focus(),300);
}

function saveEvent(){
  const name = document.getElementById('ev-name').value.trim();
  if(!name){ document.getElementById('ev-err').style.display='block'; return; }
  const e = { id:uid(), name, suppliers:[] };
  S.events.push(e);
  save();
  S.currentEvent = e;
  S.stack = [];
  showScreen('suppliers');
}

// ─── Suppliers ────────────────────────────────────────────────────────────────
function renderSuppliers(){
  document.getElementById('top-plus').classList.remove('hidden');
  const sups = S.currentEvent ? S.currentEvent.suppliers : [];
  let html = `<div class="badge badge-purple">🏛 ${S.currentEvent.name}</div>`;
  if(!sups.length){
    html += '<div class="empty">Noch keine Lieferanten.<br>Tippe + um einen hinzuzufügen.</div>';
  } else {
    sups.forEach(s=>{
      const artC=s.artikel.length;
      const inner = `<div class="card-row" onclick="openSupplier('${s.id}')">
          <div style="flex:1">
            <div class="card-name">${s.name}</div>
            <div class="card-meta">${s.contact?s.contact+' · ':''}${s.stand||'Kein Stand'}</div>
            <div class="card-meta" style="color:var(--green);margin-top:2px">${artC} Artikel · ${s.vcP} VK-Foto${s.vcP!==1?'s':''}</div>
          </div>
          <span class="chevron">›</span>
        </div>`;
      html += makeSwipeCard(inner, `deleteSupplier('${s.id}',event)`);
    });
  }
  document.getElementById('content').innerHTML = html;
  attachSwipes();
}

function openSupplier(id){
  S.currentSupplier = S.currentEvent.suppliers.find(s=>s.id===id);
  showScreen('supplier-detail');
}

function renderNewSupplier(){
  S.vcP = 0;
  document.getElementById('content').innerHTML = `
    <div class="sec">
      <div class="sec-title">1. Visitenkarte fotografieren</div>
      <div class="prow" id="vc-photos"></div>
      <div class="photo-zone" onclick="addPhoto('vc')">
        <span style="font-size:32px">📷</span>
        <div style="font-size:13px;color:var(--text2)">Visitenkarte fotografieren</div>
        <div style="font-size:12px;color:var(--text3)">Tippen zum Hinzufügen</div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-title">2. Lieferantendaten</div>
      <div class="fg">
        <div class="fl">Name des Lieferanten <span class="req">*</span></div>
        <input type="text" id="sup-name" placeholder="Firmenname" autocomplete="off">
        <div class="err-msg" id="sup-err">Bitte Namen eingeben</div>
      </div>
      <div class="fg">
        <div class="fl">Ansprechpartner</div>
        <input type="text" id="sup-contact" placeholder="Name" autocomplete="off">
      </div>
      <div class="fg" style="margin-bottom:0">
        <div class="fl">Standort / Halle</div>
        <input type="text" id="sup-stand" placeholder="z.B. Halle 7, Stand B12" autocomplete="off">
      </div>
    </div>
    <button class="btn-p" onclick="saveSupplier()">Speichern & Artikel erfassen →</button>
    <button class="btn-s" onclick="goBack()">Abbrechen</button>`;
}

function addPhoto(type){
  if(type==='vc'){ S.vcP++; renderPhotoRow('vc-photos', S.vcP, '🪪', 'vc'); }
  else { S.artP++; renderPhotoRow('art-photos', S.artP, '📷', 'art'); }
}
function delPhoto(type){
  if(type==='vc'&&S.vcP>0){ S.vcP--; renderPhotoRow('vc-photos',S.vcP,'🪪','vc'); }
  else if(type==='art'&&S.artP>0){ S.artP--; renderPhotoRow('art-photos',S.artP,'📷','art'); }
}
function renderPhotoRow(elId, count, icon, type){
  const el = document.getElementById(elId);
  if(!el) return;
  el.innerHTML = '';
  for(let i=0;i<count;i++)
    el.innerHTML+=`<div class="pthumb filled">${icon}<span class="pdel" onclick="event.stopPropagation();delPhoto('${type}')">✕</span></div>`;
}

function saveSupplier(){
  const name = document.getElementById('sup-name').value.trim();
  if(!name){ document.getElementById('sup-err').style.display='block'; return; }
  const s = { id:uid(), name,
    contact: document.getElementById('sup-contact').value.trim(),
    stand:   document.getElementById('sup-stand').value.trim(),
    vcP: S.vcP, artikel: [] };
  S.currentEvent.suppliers.push(s);
  S.currentSupplier = s;
  save();
  showScreen('supplier-detail');
}

function renderSupplierDetail(){
  document.getElementById('top-plus').classList.remove('hidden');
  const s = S.currentSupplier;
  let artHtml = '';
  if(!s.artikel.length){
    artHtml = '<div class="empty" style="padding:12px 0">Noch keine Artikel. Tippe + um einen hinzuzufügen.</div>';
  } else {
    s.artikel.forEach(a=>{
      const vol=calcVol(a.l,a.b,a.h);
      const k20=ktnCount(vol,CTN.ft20), s20=k20*a.stk;
      const inner = `<div class="card-row" onclick="openArtikel('${a.id}')">
          <div style="flex:1">
            <div class="card-name">${a.bez}</div>
            <div class="card-meta">${a.stk} Stk/Ktn · USD ${fmt(a.preis)}</div>
            <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:5px">
              <span style="font-size:11px;color:var(--text3)">20ft:</span>
              <span class="pill pill-g">${k20.toLocaleString('de-DE')} Ktn</span>
              <span class="pill pill-b">${s20.toLocaleString('de-DE')} Stk</span>
            </div>
          </div>
          <span class="chevron">›</span>
        </div>`;
      artHtml += makeSwipeCard(inner, `deleteArtikel('${a.id}',event)`);
    });
  }
  document.getElementById('content').innerHTML = `
    <div class="sec" style="display:flex;align-items:center;gap:13px;padding:13px 15px">
      <div class="av">${initials(s.name)}</div>
      <div>
        <div style="font-size:15px;font-weight:600;color:var(--text)">${s.name}</div>
        <div style="font-size:13px;color:var(--text2);margin-top:2px">${s.contact?s.contact+' · ':''}${s.stand||''}</div>
        <div style="font-size:12px;color:var(--green);margin-top:2px">${s.vcP} VK-Foto${s.vcP!==1?'s':''}</div>
      </div>
    </div>
    <div style="font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px">Artikel</div>
    ${artHtml}
    <button class="btn-p" style="margin-top:8px" onclick="showScreen('new-artikel')">+ Artikel erfassen</button>`;
  attachSwipes();
}
}

// ─── Artikel ──────────────────────────────────────────────────────────────────
function renderNewArtikel(){
  S.artP = 0;
  document.getElementById('content').innerHTML = `
    <div class="badge badge-blue">📦 ${S.currentSupplier.name}</div>
    <div class="sec">
      <div class="sec-title">Fotos</div>
      <div class="prow" id="art-photos"></div>
      <div class="photo-zone" onclick="addPhoto('art')">
        <span style="font-size:32px">📷</span>
        <div style="font-size:13px;color:var(--text2)">Artikelfotos hinzufügen</div>
        <div style="font-size:12px;color:var(--text3)">Mind. 2 Fotos empfohlen</div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-title">Stammdaten</div>
      <div class="fg">
        <div class="fl">Bezeichnung <span class="req">*</span></div>
        <input type="text" id="art-bez" placeholder="Artikelbezeichnung" autocomplete="off">
        <div class="err-msg" id="art-bez-err">Pflichtfeld</div>
      </div>
      <div class="fg">
        <div class="fl">Anzahl Stk / Ktn <span class="req">*</span></div>
        <input type="number" id="art-stk" placeholder="z.B. 6" min="1" inputmode="numeric" oninput="liveCalc()">
        <div class="err-msg" id="art-stk-err">Pflichtfeld</div>
      </div>
      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px">
        Abmessung Karton (cm) <span style="color:var(--red);font-weight:400;font-size:11px">* Pflicht</span>
      </div>
      <div class="inline3" style="margin-bottom:4px">
        <div class="fg" style="margin-bottom:0"><div class="fl">Länge</div><input type="number" id="art-l" placeholder="cm" min="0" inputmode="decimal" oninput="liveCalc()"></div>
        <div class="fg" style="margin-bottom:0"><div class="fl">Breite</div><input type="number" id="art-b" placeholder="cm" min="0" inputmode="decimal" oninput="liveCalc()"></div>
        <div class="fg" style="margin-bottom:0"><div class="fl">Höhe</div><input type="number" id="art-h" placeholder="cm" min="0" inputmode="decimal" oninput="liveCalc()"></div>
      </div>
      <div class="err-msg" id="art-dim-err" style="margin-bottom:8px">Alle Abmessungen eingeben</div>
      <div class="vol-bar" id="vol-bar">
        <div>
          <div style="font-size:11px;color:var(--green-text)">Volumen / Karton</div>
          <div style="font-size:15px;font-weight:700;color:var(--green-text)" id="vol-val">— m³</div>
        </div>
        <span style="font-size:20px">📦</span>
      </div>
      <div class="fg">
        <div class="fl">Preis / Stk in USD <span class="req">*</span></div>
        <input type="number" id="art-preis" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
        <div class="err-msg" id="art-preis-err">Pflichtfeld</div>
      </div>
      <div class="fg" style="margin-bottom:0">
        <div class="fl">Notizen</div>
        <textarea id="art-notes" rows="2" placeholder="Qualität, Besonderheiten …"></textarea>
      </div>
    </div>
    <div class="sec hidden" id="ctn-preview">
      <div class="sec-title">Container-Kapazität (Vorschau)</div>
      <div id="ctn-prev-content"></div>
    </div>
    <button class="btn-p" onclick="saveArtikel()">✓ Artikel speichern</button>
    <button class="btn-s" onclick="goBack()">Abbrechen</button>
    <div style="height:20px"></div>`;
}

function liveCalc(){
  const l=parseFloat(document.getElementById('art-l').value)||0;
  const b=parseFloat(document.getElementById('art-b').value)||0;
  const h=parseFloat(document.getElementById('art-h').value)||0;
  const stk=parseInt(document.getElementById('art-stk').value)||1;
  if(l>0&&b>0&&h>0){
    const vol=calcVol(l,b,h);
    document.getElementById('vol-val').textContent=vol.toFixed(4)+' m³';
    const k20=ktnCount(vol,CTN.ft20), k40=ktnCount(vol,CTN.ft40), k40h=ktnCount(vol,CTN.ft40h);
    document.getElementById('ctn-prev-content').innerHTML=`
      <div class="row"><div class="rl">20ft</div><div style="display:flex;gap:5px"><span class="pill pill-g">${k20.toLocaleString('de-DE')} Ktn</span><span class="pill pill-b">${(k20*stk).toLocaleString('de-DE')} Stk</span></div></div>
      <div class="row"><div class="rl">40ft</div><div style="display:flex;gap:5px"><span class="pill pill-g">${k40.toLocaleString('de-DE')} Ktn</span><span class="pill pill-b">${(k40*stk).toLocaleString('de-DE')} Stk</span></div></div>
      <div class="row"><div class="rl">40ft HQ</div><div style="display:flex;gap:5px"><span class="pill pill-g">${k40h.toLocaleString('de-DE')} Ktn</span><span class="pill pill-b">${(k40h*stk).toLocaleString('de-DE')} Stk</span></div></div>`;
    document.getElementById('ctn-preview').classList.remove('hidden');
  } else {
    document.getElementById('vol-val').textContent='— m³';
    document.getElementById('ctn-preview').classList.add('hidden');
  }
}

function saveArtikel(){
  let ok=true;
  const bez  = document.getElementById('art-bez').value.trim();
  const stk  = parseInt(document.getElementById('art-stk').value);
  const l    = parseFloat(document.getElementById('art-l').value);
  const b    = parseFloat(document.getElementById('art-b').value);
  const h    = parseFloat(document.getElementById('art-h').value);
  const preis= parseFloat(document.getElementById('art-preis').value);
  if(!bez)  { document.getElementById('art-bez-err').style.display='block';  ok=false; } else document.getElementById('art-bez-err').style.display='none';
  if(!stk||stk<1) { document.getElementById('art-stk-err').style.display='block'; ok=false; } else document.getElementById('art-stk-err').style.display='none';
  if(!l||!b||!h)  { document.getElementById('art-dim-err').style.display='block'; ok=false; } else document.getElementById('art-dim-err').style.display='none';
  if(!preis||preis<=0) { document.getElementById('art-preis-err').style.display='block'; ok=false; } else document.getElementById('art-preis-err').style.display='none';
  if(!ok) return;
  const a = { id:uid(), bez, stk, l, b, h, preis,
    notes: document.getElementById('art-notes').value.trim(),
    photos: S.artP, zoll: 0, psi: false, ffu: false };
  S.currentSupplier.artikel.push(a);
  save();
  S.currentArtikel = a;
  showScreen('artikel-detail');
}

function openArtikel(id){
  S.currentArtikel = S.currentSupplier.artikel.find(a=>a.id===id);
  showScreen('artikel-detail');
}

// ─── All Articles ─────────────────────────────────────────────────────────────
function renderAllArticles(){
  const all = (S.currentEvent?S.currentEvent.suppliers:[]).flatMap(s=>s.artikel.map(a=>({...a,supName:s.name,supId:s.id})));
  let html = `<div class="badge badge-purple">🏛 ${S.currentEvent.name}</div>`;
  if(!all.length){
    html += '<div class="empty">Noch keine Artikel erfasst.</div>';
  } else {
    all.forEach(a=>{
      const vol=calcVol(a.l,a.b,a.h);
      const k20=ktnCount(vol,CTN.ft20);
      html+=`<div class="card">
        <div class="card-name">${a.bez}</div>
        <div class="card-meta">${a.supName} · ${a.stk} Stk/Ktn · USD ${fmt(a.preis)}</div>
        <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:5px">
          <span style="font-size:11px;color:var(--text3)">20ft:</span>
          <span class="pill pill-g">${k20.toLocaleString('de-DE')} Ktn</span>
          <span class="pill pill-b">${(k20*a.stk).toLocaleString('de-DE')} Stk</span>
        </div>
      </div>`;
    });
  }
  document.getElementById('content').innerHTML = html;
}

function toggleKalkSettings(){
  const bl = document.getElementById('kalk-settings');
  const btn = document.getElementById('settings-btn');
  const hidden = bl.classList.toggle('hidden');
  btn.textContent = (hidden ? '⚙ Hintergrund-Einstellungen einblenden' : '⚙ Hintergrund-Einstellungen ausblenden');
}

function runKalc(){
  const fx   = parseFloat(document.getElementById('k-fx').value)||1.08;
  const mu   = parseFloat(document.getElementById('k-mu').value)||45;
  const sf20 = parseFloat(document.getElementById('k-sf20').value)||1800;
  const sf40 = parseFloat(document.getElementById('k-sf40').value)||2800;
  const sf40h= parseFloat(document.getElementById('k-sf40h').value)||3000;
  const zollPct = parseFloat(document.getElementById('k-zoll').value)||0;
  const psi  = document.getElementById('k-psi').checked;
  const ffu  = document.getElementById('k-ffu').checked;

  // persist settings
  S.settings = {fx,markup:mu,sf20,sf40,sf40h};
  const a = S.currentArtikel;
  a.zoll=zollPct; a.psi=psi; a.ffu=ffu;
  save();

  document.getElementById('k-mu-lbl').textContent=mu;

  const vol = calcVol(a.l,a.b,a.h);
  const ctypes=[
    {label:'20ft Container (25 m³)', ktn:ktnCount(vol,CTN.ft20),  sf:sf20,  ebs:FIX.ebs.ft20},
    {label:'40ft Container (55 m³)', ktn:ktnCount(vol,CTN.ft40),  sf:sf40,  ebs:FIX.ebs.ft40},
    {label:'40ft HQ Container (67,5 m³)', ktn:ktnCount(vol,CTN.ft40h), sf:sf40h, ebs:FIX.ebs.ft40h},
  ];

  let costsHtml='', einstHtml='', vkHtml='';

  ctypes.forEach((c,i)=>{
    const stk = c.ktn * a.stk;
    const ww_eur   = (stk * a.preis) / fx;
    const sf_eur   = c.sf / fx;
    const ebs_eur  = c.ebs / fx;
    const bank_eur = FIX.bank_usd / fx;
    const psi_eur  = psi ? FIX.psi_usd/fx : 0;
    const ffu_eur  = ffu ? FIX.ffu_eur : 0;
    const cif      = ww_eur + sf_eur + ebs_eur;
    const zoll_eur = cif * (zollPct/100);
    const sumBase  = cif + zoll_eur + FIX.zollabf + FIX.thc_isps + FIX.release + FIX.fracht + bank_eur + psi_eur + ffu_eur;
    const finanz   = sumBase * FIX.finanz;
    const rma      = sumBase * FIX.rma;
    const gesamt   = sumBase + finanz + rma;
    const e_stk    = gesamt / stk;
    const e_ktn    = gesamt / c.ktn;
    const vk_stk   = e_stk * (1+mu/100);
    const vk_ktn   = e_ktn * (1+mu/100);

    costsHtml+=`<div class="cblock">
      <div class="cblock-title">${c.label} · ${c.ktn.toLocaleString('de-DE')} Ktn · ${stk.toLocaleString('de-DE')} Stk</div>
      <div class="row"><div class="rl">Warenwert</div><div class="rv">${fmtE(ww_eur)}</div></div>
      <div class="row"><div class="rl">Seefracht</div><div class="rv">${fmtE(sf_eur)}</div></div>
      <div class="row"><div class="rl">EBS</div><div class="rv">${fmtE(ebs_eur)}</div></div>
      <div class="row"><div class="rl">Zoll (${fmt(zollPct,1)}% auf CIF)</div><div class="rv">${fmtE(zoll_eur)}</div></div>
      <div class="row"><div class="rl">Zollabfertigung</div><div class="rv">${fmtE(FIX.zollabf)}</div></div>
      <div class="row"><div class="rl">THC + ISPS</div><div class="rv">${fmtE(FIX.thc_isps)}</div></div>
      <div class="row"><div class="rl">Release + ECF</div><div class="rv">${fmtE(FIX.release)}</div></div>
      <div class="row"><div class="rl">Frachtnachlauf</div><div class="rv">${fmtE(FIX.fracht)}</div></div>
      <div class="row"><div class="rl">Bankgebühren</div><div class="rv">${fmtE(bank_eur)}</div></div>
      ${psi?`<div class="row"><div class="rl">PSI</div><div class="rv">${fmtE(psi_eur)}</div></div>`:''}
      ${ffu?`<div class="row"><div class="rl">FFU</div><div class="rv">${fmtE(ffu_eur)}</div></div>`:''}
      <div class="row"><div class="rl">Finanzierung (2,25%)</div><div class="rv">${fmtE(finanz)}</div></div>
      <div class="row"><div class="rl">RMA (3,00%)</div><div class="rv">${fmtE(rma)}</div></div>
      <div class="row" style="margin-top:2px"><div class="rl" style="font-weight:600;color:var(--text)">Gesamtkosten</div><div class="rv" style="color:var(--green);font-size:14px">${fmtE(gesamt)}</div></div>
    </div>`;

    einstHtml+=`<div class="rcard green" style="margin-bottom:${i<2?'8px':'0'}">
      <div style="font-size:12px;font-weight:600;color:var(--green-text);margin-bottom:7px">${c.label}</div>
      <div class="rc-grid">
        <div><div class="rc-lbl g">Einstand / Stk netto</div><div class="rc-val g">${fmtE(e_stk)}</div></div>
        <div><div class="rc-lbl g">Einstand / Ktn netto</div><div class="rc-val g">${fmtE(e_ktn)}</div></div>
      </div>
    </div>`;

    vkHtml+=`<div class="rcard blue" style="margin-bottom:${i<2?'8px':'0'}">
      <div style="font-size:12px;font-weight:600;color:var(--blue-text);margin-bottom:7px">${c.label}</div>
      <div class="rc-grid">
        <div><div class="rc-lbl b">VK Netto / Stk</div><div class="rc-val b">${fmtE(vk_stk)}</div></div>
        <div><div class="rc-lbl b">VK Netto / Ktn</div><div class="rc-val b">${fmtE(vk_ktn)}</div></div>
      </div>
    </div>`;
  });

  document.getElementById('k-costs').innerHTML=costsHtml;
  document.getElementById('k-einstands').innerHTML=einstHtml;
  document.getElementById('k-vk').innerHTML=vkHtml;
}
